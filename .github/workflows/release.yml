name: Release

# Publishes @rafaelfcarneiro/effect-runner to npm when a GitHub Release is published.
# Cut a release on a vX.Y.Z tag whose version matches package.json; this workflow runs the gate
# and publishes with npm provenance. Requires repo secret NPM_TOKEN (an npm automation token for
# the @rafaelfcarneiro scope).

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write # npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - run: npm run lint && npm run typecheck && npm run test && npm run build
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
