name: Release

# Publishes @rfc0/effect-runner to npm when a GitHub Release is published.
# Cut a release on a vX.Y.Z tag whose version matches package.json; this workflow runs the gate
# and *stages* the version via npm trusted publishing (OIDC) — no token or secret. The version goes
# live only after you approve it on npmjs.com (or `npm stage approve <id>`, needs 2FA). Requires a trusted publisher
# configured on npmjs.com for this repo and workflow file (release.yml); provenance is automatic.

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write # npm trusted publishing (OIDC) + provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm install -g npm@latest # trusted publishing needs npm >= 11.5.1
      - run: npm ci
      - run: npm run lint && npm run typecheck && npm run test && npm run build
      # TEMPORARY bootstrap for the first @rfc0 publish (a trusted publisher needs an existing package); revert after.
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
