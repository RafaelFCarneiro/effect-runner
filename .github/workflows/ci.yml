name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
      - run: npm run check:consumer

  # Proves the peer range's lower bound: same checks against zod 3, plus the zod-4-built package.
  gate-zod3:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Built on zod 4, then consumed under zod 3: the shipped declarations must serve both peers.
      - run: npm run build
      - run: npm i --no-save zod@3.25
      - run: npm run typecheck
      - run: npm run test
      - run: npm run check:consumer
